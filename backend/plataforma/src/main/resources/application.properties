# Configurações do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/projeto_integrador
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init-schemas.sql

# Application
spring.application.name=plataforma

# Server
server.port=8080

# Logging
logging.level.br.pucgo.ads.projetointegrador=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15replace(%logger){'^(?:br.com.puc.|br.pucgo.ads.projetointegrador.)([^.]+).*', '$1'}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# JWT Configuration
app.jwt-secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt-expiration-milliseconds=604800000

# Bean overriding (necessário para módulos com repositórios de mesmo nome)
spring.main.allow-bean-definition-overriding=true