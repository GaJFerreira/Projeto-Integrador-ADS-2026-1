# Configurações do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/projeto_integrador
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init-schemas.sql

# Server
server.port=8080

# Logging
logging.level.br.pucgo.ads.projetointegrador=DEBUG
logging.level.org.springframework.web=DEBUG

# JWT Configuration
app.jwt-secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt-expiration-milliseconds=604800000

# Bean overriding (necessário para módulos com repositórios de mesmo nome)
spring.main.allow-bean-definition-overriding=true

# Configurações de upload das mídias do módulo sabor família
sabor-familia.upload.base-dir=./storage/sabor-familia
sabor-familia.upload.max-upload-bytes=1572864
sabor-familia.upload.max-upload-width-px=2400
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB